<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 180" width="100%" height="100%">
  <defs>
    <!-- Background Ambient Glow -->
    <radialGradient id="hGlow" cx="20%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#38BDF8" stop-opacity="0.35"/>
      <stop offset="60%" stop-color="#818CF8" stop-opacity="0.1"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
    </radialGradient>

    <!-- Frosted Glass Surface Gradient -->
    <linearGradient id="hGlassSurface" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.22"/>
      <stop offset="50%" stop-color="#FFFFFF" stop-opacity="0.06"/>
      <stop offset="100%" stop-color="#38BDF8" stop-opacity="0.15"/>
    </linearGradient>

    <!-- Glass Specular Border -->
    <linearGradient id="hGlassBorder" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.8"/>
      <stop offset="40%" stop-color="#FFFFFF" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#38BDF8" stop-opacity="0.6"/>
    </linearGradient>

    <!-- Brand Vibrant Gradient -->
    <linearGradient id="hBrandGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38BDF8"/>
      <stop offset="50%" stop-color="#818CF8"/>
      <stop offset="100%" stop-color="#C084FC"/>
    </linearGradient>

    <linearGradient id="textGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38BDF8"/>
      <stop offset="100%" stop-color="#818CF8"/>
    </linearGradient>

    <filter id="hShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feOffset dx="0" dy="6" result="offset"/>
      <feComposite in="SourceGraphic" in2="offset" operator="over"/>
    </filter>
  </defs>

  <!-- Ambient Glow Behind Logo Icon -->
  <ellipse cx="105" cy="90" rx="90" ry="70" fill="url(#hGlow)"/>

  <!-- Logo Mark (Left) -->
  <g filter="url(#hShadow)">
    <!-- TV Chassis -->
    <rect x="30" y="32" width="150" height="104" rx="20" fill="url(#hGlassSurface)" stroke="url(#hGlassBorder)" stroke-width="2"/>
    
    <!-- Y Glyph inside TV -->
    <path d="M 76 60 L 105 82 L 134 60 C 137 57 142 60 142 64 C 142 67 140 70 137 72 L 112 91 L 112 112 C 112 116 109 119 105 119 C 101 119 98 116 98 112 L 98 91 L 73 72 C 70 70 68 67 68 64 C 68 60 73 57 76 60 Z" 
          fill="url(#hBrandGrad)"/>
    
    <!-- Crisp Specular Light -->
    <path d="M 76 60 L 105 82 L 134 60" fill="none" stroke="#FFFFFF" stroke-width="2.5" stroke-linecap="round" opacity="0.9"/>
    
    <!-- Stand -->
    <path d="M 94 137 L 97 148 L 113 148 L 116 137 Z" fill="url(#hGlassSurface)" stroke="url(#hGlassBorder)" stroke-width="1.5"/>
    <rect x="86" y="148" width="38" height="3" rx="1.5" fill="url(#hGlassBorder)"/>
  </g>

  <!-- Brand Typography (Right) -->
  <!-- "Your" -->
  <text x="215" y="102" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, sans-serif" 
        font-size="64" font-weight="800" letter-spacing="-1.5" fill="#FFFFFF">Your</text>
  
  <!-- "New" -->
  <text x="368" y="102" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, sans-serif" 
        font-size="64" font-weight="800" letter-spacing="-1.5" fill="url(#textGrad)">New</text>
  
  <!-- "TV" -->
  <text x="502" y="102" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, sans-serif" 
        font-size="64" font-weight="300" letter-spacing="1" fill="#E2E8F0">TV</text>

  <!-- Tagline -->
  <text x="218" y="132" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, sans-serif" 
        font-size="16" font-weight="500" letter-spacing="3" text-transform="uppercase" fill="#94A3B8">AMBIENT GLASS LAUNCHER</text>
</svg>
